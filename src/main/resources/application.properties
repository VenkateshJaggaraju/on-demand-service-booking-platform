spring.application.name=OnDemandServiceBookingPlatform

server.port=${PORT:1086}

#spring.datasource.url=jdbc:postgresql://localhost:5432/OnDemandServiceBookingPlatform

# MongoDB Atlas deployment server butn't local MongoDB community server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.mongodb.uri=${MONGODB_URL}

# BigDecimal
spring.mongodb.representation.big-decimal=decimal128

# this job schedules for each 30 secs
payment.scheduler.reconcile-cron=0/30 * * * * *

